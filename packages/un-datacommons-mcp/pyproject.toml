[project]
name = "un-datacommons-mcp"
version = "1.0.0"
description = "Wrapper package for UN Data Commons MCP Server (delegates to datacommons-mcp)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
dependencies = [
  "datacommons-mcp>=1.0.0",
]

[project.scripts]
un-datacommons-mcp = "un_datacommons_mcp.cli:cli"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["un_datacommons_mcp*"]

